name: SauceDemo Playwright

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm test -- --project=chromium --workers=1

      - name: Generate Allure report
        if: always()
        run: |
          if [ -d allure-results ] && [ -n "$(find allure-results -type f -name '*-result.json' -print -quit)" ]; then
            npm run report:allure
          else
            echo "::warning::No Allure results were generated."
          fi

      - name: Upload test reports and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saucedemo-playwright-${{ github.run_number }}
          path: |
            playwright-report/
            allure-results/
            allure-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
